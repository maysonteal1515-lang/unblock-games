<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .wrapper {
      background: #1e293b;
      border: 3px solid #475569;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 2px solid #334155;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 6px;
    }
    .counter {
      font-size: 24px;
      font-weight: 800;
      color: #ef4444;
      font-family: monospace;
      min-width: 50px;
    }
    .face-btn {
      font-size: 24px;
      background: #334155;
      border: 2px solid #64748b;
      border-radius: 6px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(9, 32px);
      grid-gap: 3px;
      background: #0f172a;
      padding: 6px;
      border-radius: 6px;
      border: 2px solid #334155;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #334155;
      border: 2px outset #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .cell.revealed {
      background: #1e293b;
      border: 1px solid #334155;
      cursor: default;
    }
    .cell.mine { background: #ef4444; }
    .c-1 { color: #38bdf8; }
    .c-2 { color: #4ade80; }
    .c-3 { color: #f87171; }
    .c-4 { color: #a855f7; }
    .c-5 { color: #fbbf24; }
    .c-6 { color: #2dd4bf; }
    .c-7 { color: #f43f5e; }
    .c-8 { color: #94a3b8; }
    .hint {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="top-bar">
      <div class="counter" id="mines">010</div>
      <button class="face-btn" id="face" onclick="init()">🙂</button>
      <div class="counter" id="timer">000</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="hint">Left Click to Reveal · Right Click or Long Press to Flag 🚩</div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const TOTAL_MINES = 10;

    let board = [];
    let state = 'ready'; // ready, playing, won, lost
    let timerVal = 0;
    let timerId = null;
    let flaggedCount = 0;

    function init() {
      if (timerId) clearInterval(timerId);
      timerVal = 0;
      document.getElementById('timer').innerText = '000';
      document.getElementById('mines').innerText = String(TOTAL_MINES).padStart(3, '0');
      document.getElementById('face').innerText = '🙂';
      state = 'ready';
      flaggedCount = 0;

      board = [];
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        board[r] = [];
        for (let c = 0; c < COLS; c++) {
          const cell = {
            r, c,
            isMine: false,
            revealed: false,
            flagged: false,
            count: 0,
            el: null
          };
          const div = document.createElement('div');
          div.className = 'cell';
          div.addEventListener('click', () => handleClick(r, c));
          div.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleRightClick(r, c);
          });
          gridEl.appendChild(div);
          cell.el = div;
          board[r][c] = cell;
        }
      }
    }

    function plantMines(safeR, safeC) {
      let planted = 0;
      while (planted < TOTAL_MINES) {
        let r = Math.floor(Math.random() * ROWS);
        let c = Math.floor(Math.random() * COLS);
        if ((r === safeR && c === safeC) || board[r][c].isMine) continue;
        board[r][c].isMine = true;
        planted++;
      }

      // calculate neighbor counts
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].isMine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              let nr = r + dr;
              let nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                if (board[nr][nc].isMine) count++;
              }
            }
          }
          board[r][c].count = count;
        }
      }
    }

    function handleClick(r, c) {
      if (state === 'won' || state === 'lost') return;
      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (state === 'ready') {
        state = 'playing';
        plantMines(r, c);
        timerId = setInterval(() => {
          timerVal++;
          if (timerVal <= 999) {
            document.getElementById('timer').innerText = String(timerVal).padStart(3, '0');
          }
        }, 1000);
      }

      if (cell.isMine) {
        gameOver(false);
        return;
      }

      reveal(r, c);
      checkWin();
    }

    function reveal(r, c) {
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;
      cell.revealed = true;
      cell.el.classList.add('revealed');

      if (cell.count > 0) {
        cell.el.innerText = cell.count;
        cell.el.classList.add('c-' + cell.count);
      } else {
        // Flood fill empty neighbors
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            let nr = r + dr;
            let nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              reveal(nr, nc);
            }
          }
        }
      }
    }

    function handleRightClick(r, c) {
      if (state === 'won' || state === 'lost') return;
      const cell = board[r][c];
      if (cell.revealed) return;

      cell.flagged = !cell.flagged;
      cell.el.innerText = cell.flagged ? '🚩' : '';
      flaggedCount += cell.flagged ? 1 : -1;
      const rem = Math.max(0, TOTAL_MINES - flaggedCount);
      document.getElementById('mines').innerText = String(rem).padStart(3, '0');
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine && !board[r][c].revealed) {
            unrevealedSafe++;
          }
        }
      }
      if (unrevealedSafe === 0) {
        gameOver(true);
      }
    }

    function gameOver(won) {
      state = won ? 'won' : 'lost';
      clearInterval(timerId);
      document.getElementById('face').innerText = won ? '😎' : '😵';

      // reveal all mines
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          let cell = board[r][c];
          if (cell.isMine) {
            cell.el.innerText = '💣';
            if (!won) cell.el.classList.add('mine');
          }
        }
      }
    }

    init();
  </script>
</body>
</html>
