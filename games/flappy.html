<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Bird</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-box {
      position: relative;
      width: 360px;
      height: 520px;
      border: 3px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
      background: #70c5ce;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      font-size: 36px;
      font-weight: 900;
      color: white;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      pointer-events: none;
      z-index: 5;
    }
    .modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .modal h2 { font-size: 28px; font-weight: 800; margin-bottom: 8px; color: #fbbf24; }
    .modal p { font-size: 14px; color: #cbd5e1; margin-bottom: 16px; }
    .btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #d97706;
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #d97706; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="game-box" id="box">
    <div class="hud" id="hud">0</div>
    <div class="modal" id="startModal">
      <h2>Flappy Pixel</h2>
      <p>Click, Tap, or Space to Flap!</p>
      <button class="btn" onclick="start()">Start Flight</button>
    </div>
    <div class="modal hidden" id="overModal">
      <h2>Game Over</h2>
      <p id="overText">Score: 0 | Best: 0</p>
      <button class="btn" onclick="start()">Play Again</button>
    </div>
    <canvas id="canvas" width="360" height="520"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const startModal = document.getElementById('startModal');
    const overModal = document.getElementById('overModal');
    const overText = document.getElementById('overText');

    let state = 'menu'; // menu, playing, dead
    let frames = 0;
    let score = 0;
    let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);

    const bird = {
      x: 60,
      y: 200,
      radius: 12,
      velocity: 0,
      gravity: 0.38,
      jump: -6.8,
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity * 0.08)));
        ctx.rotate(angle);

        // Body
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ca8a04';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Eye
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(4, -4, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(5, -4, 2, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(8, -2);
        ctx.lineTo(16, 2);
        ctx.lineTo(8, 6);
        ctx.fill();

        // Wing
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.ellipse(-4, 2, 6, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      },
      update() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        // Ground collision
        if (this.y + this.radius >= canvas.height - 40) {
          this.y = canvas.height - 40 - this.radius;
          die();
        }
        // Ceiling
        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.velocity = 0;
        }
      },
      flap() {
        this.velocity = this.jump;
      }
    };

    const pipes = {
      list: [],
      gap: 120,
      width: 52,
      dx: 2.2,
      update() {
        if (frames % 100 === 0) {
          const minPipe = 50;
          const maxPipe = canvas.height - 40 - this.gap - minPipe;
          const topHeight = Math.floor(Math.random() * (maxPipe - minPipe + 1)) + minPipe;
          this.list.push({
            x: canvas.width,
            top: topHeight,
            bottom: canvas.height - 40 - topHeight - this.gap,
            passed: false
          });
        }

        for (let i = this.list.length - 1; i >= 0; i--) {
          let p = this.list[i];
          p.x -= this.dx;

          // Check bird collision
          // Top pipe
          if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + this.width) {
            if (bird.y - bird.radius < p.top || bird.y + bird.radius > canvas.height - 40 - p.bottom) {
              die();
            }
          }

          // Score check
          if (!p.passed && p.x + this.width < bird.x) {
            p.passed = true;
            score++;
            hud.innerText = score;
          }

          // Offscreen
          if (p.x + this.width < 0) {
            this.list.splice(i, 1);
          }
        }
      },
      draw() {
        for (let p of this.list) {
          // Top pipe
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(p.x, 0, this.width, p.top);
          ctx.strokeStyle = '#15803d';
          ctx.lineWidth = 3;
          ctx.strokeRect(p.x, 0, this.width, p.top);
          // Pipe rim
          ctx.fillRect(p.x - 3, p.top - 16, this.width + 6, 16);
          ctx.strokeRect(p.x - 3, p.top - 16, this.width + 6, 16);

          // Bottom pipe
          const bottomY = canvas.height - 40 - p.bottom;
          ctx.fillRect(p.x, bottomY, this.width, p.bottom);
          ctx.strokeRect(p.x, bottomY, this.width, p.bottom);
          // Pipe rim
          ctx.fillRect(p.x - 3, bottomY, this.width + 6, 16);
          ctx.strokeRect(p.x - 3, bottomY, this.width + 6, 16);
        }
      },
      reset() {
        this.list = [];
      }
    };

    function start() {
      bird.y = 200;
      bird.velocity = 0;
      pipes.reset();
      score = 0;
      frames = 0;
      hud.innerText = '0';
      startModal.classList.add('hidden');
      overModal.classList.add('hidden');
      state = 'playing';
    }

    function die() {
      if (state !== 'playing') return;
      state = 'dead';
      if (score > best) {
        best = score;
        localStorage.setItem('flappy_best', best);
      }
      overText.innerText = `Score: ${score}  ·  Best: ${best}`;
      overModal.classList.remove('hidden');
    }

    function loop() {
      frames++;

      // Sky & clouds
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.beginPath();
      ctx.arc(80, 80, 24, 0, Math.PI * 2);
      ctx.arc(110, 75, 32, 0, Math.PI * 2);
      ctx.arc(140, 80, 24, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(260, 140, 20, 0, Math.PI * 2);
      ctx.arc(285, 135, 28, 0, Math.PI * 2);
      ctx.arc(310, 140, 20, 0, Math.PI * 2);
      ctx.fill();

      if (state === 'playing') {
        pipes.update();
        bird.update();
      }

      pipes.draw();
      bird.draw();

      // Ground
      ctx.fillStyle = '#84cc16';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 10);
      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

      requestAnimationFrame(loop);
    }

    function flap() {
      if (state === 'playing') {
        bird.flap();
      } else if (state === 'menu') {
        start();
      }
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      flap();
    });

    loop();
  </script>
</body>
</html>
