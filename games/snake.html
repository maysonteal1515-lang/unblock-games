<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title h1 { font-size: 24px; font-weight: 800; color: #10b981; }
    .scores { display: flex; gap: 8px; }
    .score-card {
      background: #1e293b;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      text-align: center;
    }
    .score-card .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
    .score-card .val { font-size: 16px; font-weight: 700; color: #ffffff; }
    .canvas-container {
      position: relative;
      background: #111827;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      background: #090e17;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-gap: 8px;
      margin-top: 14px;
    }
    .ctrl-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      font-size: 18px;
      font-weight: bold;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .ctrl-btn:active { background: #3b82f6; }
    .up-btn { grid-column: 2; }
    .left-btn { grid-column: 1; grid-row: 2; }
    .down-btn { grid-column: 2; grid-row: 2; }
    .right-btn { grid-column: 3; grid-row: 2; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 26px; color: #ef4444; margin-bottom: 8px; }
    .btn {
      background: #10b981;
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn:hover { background: #059669; color: white; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <h1>Snake Classic</h1>
    </div>
    <div class="scores">
      <div class="score-card">
        <div class="label">Score</div>
        <div class="val" id="score">0</div>
      </div>
      <div class="score-card">
        <div class="label">High</div>
        <div class="val" id="high">0</div>
      </div>
    </div>
  </div>

  <div class="canvas-container">
    <div class="overlay" id="overlay">
      <h2 id="ov-title">Snake Retro</h2>
      <p id="ov-sub" style="font-size: 14px; color: #94a3b8;">Eat food, avoid walls and your tail</p>
      <button class="btn" id="start-btn" onclick="startGame()">Play Game</button>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
  </div>

  <div class="controls">
    <button class="ctrl-btn up-btn" onclick="sendDir('up')">▲</button>
    <button class="ctrl-btn left-btn" onclick="sendDir('left')">◀</button>
    <button class="ctrl-btn down-btn" onclick="sendDir('down')">▼</button>
    <button class="ctrl-btn right-btn" onclick="sendDir('right')">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 15};
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_highscore') || '0', 10);
    document.getElementById('high').innerText = highScore;

    let gameLoop = null;
    let isRunning = false;

    function resetFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) {
          resetFood();
          break;
        }
      }
    }

    function startGame() {
      snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      document.getElementById('score').innerText = score;
      document.getElementById('overlay').classList.add('hidden');
      resetFood();
      isRunning = true;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      document.getElementById('ov-title').innerText = 'Game Over';
      document.getElementById('ov-sub').innerText = 'Final Score: ' + score;
      document.getElementById('start-btn').innerText = 'Play Again';
      document.getElementById('overlay').classList.remove('hidden');
    }

    function update() {
      dx = nextDx;
      dy = nextDy;
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').innerText = score;
        if (score > highScore) {
          highScore = score;
          document.getElementById('high').innerText = highScore;
          localStorage.setItem('snake_highscore', highScore);
        }
        resetFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background grid
      ctx.fillStyle = '#090e17';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      for (let i = 0; i < canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((seg, idx) => {
        if (idx === 0) {
          ctx.fillStyle = '#34d399';
        } else {
          ctx.fillStyle = '#10b981';
        }
        ctx.fillRect(seg.x * gridSize + 1, seg.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });
    }

    function sendDir(dir) {
      if (dir === 'up' && dy === 0) { nextDx = 0; nextDy = -1; }
      if (dir === 'down' && dy === 0) { nextDx = 0; nextDy = 1; }
      if (dir === 'left' && dx === 0) { nextDx = -1; nextDy = 0; }
      if (dir === 'right' && dx === 0) { nextDx = 1; nextDy = 0; }
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); sendDir('up'); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); sendDir('down'); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); sendDir('left'); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); sendDir('right'); }
      if (e.code === 'Space' && !isRunning) { startGame(); }
    });

    draw();
  </script>
</body>
</html>
